name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_NAME: test
      LLM_PROVIDER: ollama
      LLM_MODEL: test-model

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile config.py rule_registry.py stewardship_context.py remediation_decision.py rule_approval.py scripts/*.py tests/*.py

      - name: Run tests
        run: pytest
